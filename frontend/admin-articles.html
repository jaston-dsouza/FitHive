<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Article Management - FitHive Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="admin-sidebar">
      <div class="p-4">
        <h4 class="text-white mb-4"><img src="assets/logo.png" width="70" height="70"><strong>FitHive Admin</strong></h4>
        <nav class="nav flex-column">
          <a class="nav-link" href="admin.html">📊 Dashboard</a>
          <a class="nav-link" href="admin-users.html">👥 Users</a>
          <a class="nav-link" href="admin-workouts.html">💪 Workouts</a>
          <a class="nav-link active" href="admin-articles.html">📚 Articles</a>
          <a class="nav-link" href="admin-challenges.html">🏆 Challenges</a>
          <hr class="my-3" style="border-color: rgba(255,255,255,0.2)">
          <a class="nav-link" href="dashboard.html">🏠 Back to Main Site</a>
          <a class="nav-link" href="#" id="adminLogout">🚪 Logout</a>
        </nav>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1" style="background-color: #f8f9fa;">
      <!-- Top Bar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1">Article Management</span>
          <div class="ms-auto">
            <button class="btn btn-success btn-sm me-2" data-bs-toggle="modal" data-bs-target="#addArticleModal">
              ➕ Add New Article
            </button>
            <span class="badge bg-primary" id="adminUserBadge">Admin</span>
          </div>
        </div>
      </nav>

      <!-- Content -->
      <div class="container-fluid p-4">
        <div class="row mb-4">
          <div class="col-12">
            <div class="card shadow">
              <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-primary">All Articles</h6>
                <div>
                  <select class="form-select form-select-sm d-inline-block me-2" style="width: 150px;" 
                    id="filterStatus" onchange="filterArticles()">
                    <option value="">All Status</option>
                    <option value="1">Published</option>
                    <option value="0">Draft</option>
                  </select>
                  <input type="text" class="form-control form-control-sm d-inline-block" style="width: 250px;" 
                    id="searchArticles" placeholder="Search articles...">
                  <button class="btn btn-sm btn-primary ms-2" onclick="loadArticles()">
                    🔄️ Refresh
                  </button>
                </div>
              </div>
              <div class="card-body">
                <div class="alert alert-info d-none" id="articleAlert"></div>
                
                <div class="table-responsive">
                  <table class="table table-hover">
                    <thead class="table-light">
                      <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Author</th>
                        <th>Created</th>
                        <th>Updated</th>
                        <th>Status</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody id="articlesTableBody">
                      <tr>
                        <td colspan="8" class="text-center py-5">
                          <div class="spinner-border text-primary" role="status"></div>
                          <p class="mt-2 text-muted">Loading articles...</p>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Article Modal -->
  <div class="modal fade" id="addArticleModal" tabindex="-1">
    <div class="modal-dialog modal-xl">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="articleModalTitle">Add New Article</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="articleForm">
            <input type="hidden" id="articleId">
            
            <div class="row">
              <div class="col-md-8 mb-3">
                <label for="articleTitle" class="form-label">Article Title *</label>
                <input type="text" class="form-control" id="articleTitle" required>
              </div>
              
              <div class="col-md-4 mb-3">
                <label for="articleCategory" class="form-label">Category *</label>
                <select class="form-select" id="articleCategory" required>
                  <option value="">Select Category</option>
                  <option value="Weight Loss">Weight Loss</option>
                  <option value="Muscle Gain">Muscle Gain</option>
                  <option value="Nutrition">Nutrition</option>
                  <option value="General Fitness">General Fitness</option>
                  <option value="Mental Health">Mental Health</option>
                  <option value="Equipment">Equipment</option>
                  <option value="Tips & Tricks">Tips & Tricks</option>
                </select>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="articleAuthor" class="form-label">Author *</label>
                <input type="text" class="form-control" id="articleAuthor" required>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="articleImage" class="form-label">Image URL</label>
                <input type="url" class="form-control" id="articleImage" 
                  placeholder="https://example.com/image.jpg">
              </div>
            </div>
            
            <div class="mb-3">
              <label for="articleContent" class="form-label">Content *</label>
              <textarea class="form-control" id="articleContent" rows="12" required 
                placeholder="Write your article content here..."></textarea>
              <small class="text-muted">You can use basic HTML formatting</small>
            </div>
            
            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="isPublished">
                <label class="form-check-label" for="isPublished">
                  Publish article (make it visible to users)
                </label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveArticle()">Save Article</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let allArticles = [];
    let editMode = false;

    document.addEventListener('DOMContentLoaded', async () => {
      checkAuth();
      await loadArticles();
      
      // Search functionality
      document.getElementById('searchArticles').addEventListener('input', filterArticles);
    });

    async function loadArticles() {
      try {
        const response = await fetch(`${API_URL}/admin/articles`, {
          headers: getAuthHeaders()
        });
        
        if (response.ok) {
          allArticles = await response.json();
          displayArticles(allArticles);
        } else {
          showArticleAlert('Failed to load articles', 'danger');
        }
      } catch (error) {
        console.error('Error loading articles:', error);
        showArticleAlert('Error loading articles', 'danger');
      }
    }

    function displayArticles(articles) {
      const tbody = document.getElementById('articlesTableBody');
      
      if (articles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No articles found</td></tr>';
        return;
      }
      
      tbody.innerHTML = '';
      articles.forEach(article => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${article.article_id}</td>
          <td><strong>${article.title}</strong></td>
          <td><span class="badge bg-secondary">${article.category}</span></td>
          <td>${article.author}</td>
          <td>${formatDate(article.created_at)}</td>
          <td>${formatDate(article.updated_at)}</td>
          <td><span class="badge bg-${article.is_published ? 'success' : 'warning'}">${article.is_published ? 'Published' : 'Draft'}</span></td>
          <td>
            <button class="btn btn-sm btn-info" onclick="viewArticle(${article.article_id})">View</button>
            <button class="btn btn-sm btn-warning" onclick="editArticle(${article.article_id})">Edit</button>
            <button class="btn btn-sm btn-${article.is_published ? 'secondary' : 'success'}" 
              onclick="toggleArticleStatus(${article.article_id}, ${article.is_published})">
              ${article.is_published ? 'Draft' : 'Publish'}
            </button>
            <button class="btn btn-sm btn-danger" onclick="deleteArticle(${article.article_id})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function filterArticles() {
      const searchTerm = document.getElementById('searchArticles').value.toLowerCase();
      const status = document.getElementById('filterStatus').value;
      
      let filtered = allArticles;
      
      if (searchTerm) {
        filtered = filtered.filter(article => 
          article.title.toLowerCase().includes(searchTerm) ||
          article.content.toLowerCase().includes(searchTerm) ||
          article.author.toLowerCase().includes(searchTerm)
        );
      }
      
      if (status !== '') {
        filtered = filtered.filter(article => article.is_published == parseInt(status));
      }
      
      displayArticles(filtered);
    }

    function viewArticle(articleId) {
      const article = allArticles.find(a => a.article_id === articleId);
      if (articleId==1)
      window.open(`https://www.medicalnewstoday.com/articles/303409`, '_self');

      else if(articleId==2)
      window.open(`https://www.fit3d.com/blog/beginners-guide-to-building-muscle`, '_self');

      else
      window.open(`https://www.healthline.com/health/exercise-fitness/rest-day`, '_self');
    }

    function editArticle(articleId) {
      const article = allArticles.find(a => a.article_id === articleId);
      if (!article) return;
      
      editMode = true;
      document.getElementById('articleModalTitle').textContent = 'Edit Article';
      document.getElementById('articleId').value = article.article_id;
      document.getElementById('articleTitle').value = article.title;
      document.getElementById('articleCategory').value = article.category;
      document.getElementById('articleAuthor').value = article.author;
      document.getElementById('articleImage').value = article.image_url || '';
      document.getElementById('articleContent').value = article.content;
      document.getElementById('isPublished').checked = article.is_published;
      
      const modal = new bootstrap.Modal(document.getElementById('addArticleModal'));
      modal.show();
    }

    async function saveArticle() {
      const articleData = {
        title: document.getElementById('articleTitle').value,
        category: document.getElementById('articleCategory').value,
        author: document.getElementById('articleAuthor').value,
        image_url: document.getElementById('articleImage').value,
        content: document.getElementById('articleContent').value,
        is_published: document.getElementById('isPublished').checked
      };
      
      try {
        let response;
        if (editMode) {
          const articleId = document.getElementById('articleId').value;
          response = await fetch(`${API_URL}/admin/articles/${articleId}`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(articleData)
          });
        } else {
          response = await fetch(`${API_URL}/admin/articles`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify(articleData)
          });
        }
        
        if (response.ok) {
          showArticleAlert(`Article ${editMode ? 'updated' : 'created'} successfully`, 'success');
          bootstrap.Modal.getInstance(document.getElementById('addArticleModal')).hide();
          document.getElementById('articleForm').reset();
          editMode = false;
          await loadArticles();
        } else {
          showArticleAlert('Failed to save article', 'danger');
        }
      } catch (error) {
        console.error('Error:', error);
        showArticleAlert('Error saving article', 'danger');
      }
    }

    async function toggleArticleStatus(articleId, isPublished) {
      try {
        const response = await fetch(`${API_URL}/admin/articles/${articleId}/toggle`, {
          method: 'PUT',
          headers: getAuthHeaders()
        });
        
        if (response.ok) {
          showArticleAlert('Article status updated', 'success');
          await loadArticles();
        } else {
          showArticleAlert('Failed to update status', 'danger');
        }
      } catch (error) {
        console.error('Error:', error);
        showArticleAlert('Error updating status', 'danger');
      }
    }

    async function deleteArticle(articleId) {
      if (!confirm('Are you sure you want to delete this article? This action cannot be undone.')) return;
      
      try {
        const response = await fetch(`${API_URL}/admin/articles/${articleId}`, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });
        
        if (response.ok) {
          showArticleAlert('Article deleted successfully', 'success');
          await loadArticles();
        } else {
          showArticleAlert('Failed to delete article', 'danger');
        }
      } catch (error) {
        console.error('Error:', error);
        showArticleAlert('Error deleting article', 'danger');
      }
    }

    function showArticleAlert(message, type) {
      const alert = document.getElementById('articleAlert');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alert.classList.remove('d-none');
      
      setTimeout(() => {
        alert.classList.add('d-none');
      }, 3000);
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString();
    }

    // Reset form when modal is closed
    document.getElementById('addArticleModal').addEventListener('hidden.bs.modal', function () {
      document.getElementById('articleForm').reset();
      document.getElementById('articleModalTitle').textContent = 'Add New Article';
      editMode = false;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Challenge Management - FitHive Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <div class="admin-sidebar">
      <div class="p-4">
        <h4 class="text-white mb-4"><img src="assets/logo.png" width="70" height="70"><strong>FitHive Admin</strong></h4>
        <nav class="nav flex-column">
          <a class="nav-link" href="admin.html">📊 Dashboard</a>
          <a class="nav-link" href="admin-users.html">👥 Users</a>
          <a class="nav-link" href="admin-workouts.html">💪 Workouts</a>
          <a class="nav-link" href="admin-articles.html">📚 Articles</a>
          <a class="nav-link active" href="admin-challenges.html">🏆 Challenges</a>
          <hr class="my-3" style="border-color: rgba(255,255,255,0.2)">
          <a class="nav-link" href="dashboard.html">🏠 Back to Main Site</a>
          <a class="nav-link" href="#" id="adminLogout">🚪 Logout</a>
        </nav>
      </div>
    </div>

    <!-- Main Content -->
    <div class="flex-grow-1" style="background-color: #f8f9fa;">
      <!-- Top Bar -->
      <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
        <div class="container-fluid">
          <span class="navbar-brand mb-0 h1">Challenge Management</span>
          <div class="ms-auto">
            <button class="btn btn-success btn-sm me-2" data-bs-toggle="modal" data-bs-target="#addChallengeModal">
              ➕ Add New Challenge
            </button>
            <span class="badge bg-primary" id="adminUserBadge">Admin</span>
          </div>
        </div>
      </nav>

      <!-- Content -->
      <div class="container-fluid p-4">
        <div class="row mb-4">
          <div class="col-12">
            <div class="card shadow">
              <div class="card-header py-3 d-flex justify-content-between align-items-center">
                <h6 class="m-0 font-weight-bold text-primary">All Challenges</h6>
                <div>
                  <select class="form-select form-select-sm d-inline-block me-2" style="width: 150px;" 
                    id="filterStatus" onchange="filterChallenges()">
                    <option value="">All Status</option>
                    <option value="active">Active</option>
                    <option value="upcoming">Upcoming</option>
                    <option value="ended">Ended</option>
                  </select>
                  <input type="text" class="form-control form-control-sm d-inline-block" style="width: 250px;" 
                    id="searchChallenges" placeholder="Search challenges...">
                  <button class="btn btn-sm btn-primary ms-2" onclick="loadChallenges()">
                    🔄️ Refresh
                  </button>
                </div>
              </div>
              <div class="card-body">
                <div class="alert alert-info d-none" id="challengeAlert"></div>
                
                <div class="table-responsive">
                  <table class="table table-hover">
                    <thead class="table-light">
                      <tr>
                        <th>ID</th>
                        <th>Challenge Name</th>
                        <th>Start Date</th>
                        <th>End Date</th>
                        <th>Target</th>
                        <th>Reward Points</th>
                        <th>Status</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody id="challengesTableBody">
                      <tr>
                        <td colspan="8" class="text-center py-5">
                          <div class="spinner-border text-primary" role="status"></div>
                          <p class="mt-2 text-muted">Loading challenges...</p>
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Challenge Modal -->
  <div class="modal fade" id="addChallengeModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title" id="challengeModalTitle">Add New Challenge</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="challengeForm">
            <input type="hidden" id="challengeId">
            
            <div class="mb-3">
              <label for="challengeName" class="form-label">Challenge Name *</label>
              <input type="text" class="form-control" id="challengeName" required>
            </div>
            
            <div class="mb-3">
              <label for="description" class="form-label">Description</label>
              <textarea class="form-control" id="description" rows="3" 
                placeholder="Describe the challenge..."></textarea>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="startDate" class="form-label">Start Date *</label>
                <input type="date" class="form-control" id="startDate" required>
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="endDate" class="form-label">End Date *</label>
                <input type="date" class="form-control" id="endDate" required>
              </div>
            </div>
            
            <div class="row">
              <div class="col-md-6 mb-3">
                <label for="targetMetric" class="form-label">Target Metric</label>
                <input type="text" class="form-control" id="targetMetric" 
                  placeholder="e.g., Steps, Calories, Workout Minutes">
              </div>
              
              <div class="col-md-6 mb-3">
                <label for="targetValue" class="form-label">Target Value</label>
                <input type="number" class="form-control" id="targetValue" min="0">
              </div>
            </div>
            
            <div class="mb-3">
              <label for="rewardPoints" class="form-label">Reward Points *</label>
              <input type="number" class="form-control" id="rewardPoints" min="0" required>
            </div>
            
            <div class="mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="isActive" checked>
                <label class="form-check-label" for="isActive">
                  Active (visible to users)
                </label>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveChallenge()">Save Challenge</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/admin.js"></script>
  <script>
    let allChallenges = [];
    let editMode = false;

    document.addEventListener('DOMContentLoaded', async () => {
      checkAuth();
      await loadChallenges();
      
      // Search functionality
      document.getElementById('searchChallenges').addEventListener('input', filterChallenges);
      
      // Set minimum date to today
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('startDate').setAttribute('min', today);
      document.getElementById('endDate').setAttribute('min', today);
    });

    async function loadChallenges() {
      try {
        const response = await fetch(`${API_URL}/admin/challenges`, {
          headers: getAuthHeaders()
        });
        
        if (response.ok) {
          allChallenges = await response.json();
          displayChallenges(allChallenges);
        } else {
          showChallengeAlert('Failed to load challenges', 'danger');
        }
      } catch (error) {
        console.error('Error loading challenges:', error);
        showChallengeAlert('Error loading challenges', 'danger');
      }
    }

    function displayChallenges(challenges) {
      const tbody = document.getElementById('challengesTableBody');
      
      if (challenges.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8" class="text-center text-muted py-4">No challenges found</td></tr>';
        return;
      }
      
      tbody.innerHTML = '';
      challenges.forEach(challenge => {
        const status = getChallengeStatus(challenge);
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${challenge.challenge_id}</td>
          <td><strong>${challenge.challenge_name}</strong></td>
          <td>${formatDate(challenge.start_date)}</td>
          <td>${formatDate(challenge.end_date)}</td>
          <td>${challenge.target_metric || '-'}: ${challenge.target_value || '-'}</td>
          <td><span class="badge bg-warning">${challenge.reward_points} pts</span></td>
          <td><span class="badge bg-${getStatusColor(status)}">${status}</span></td>
          <td>
            <button class="btn btn-sm btn-warning" onclick="editChallenge(${challenge.challenge_id})">Edit</button>
            <button class="btn btn-sm btn-${challenge.is_active ? 'secondary' : 'success'}" 
              onclick="toggleChallengeStatus(${challenge.challenge_id}, ${challenge.is_active})">
              ${challenge.is_active ? 'Deactivate' : 'Activate'}
            </button>
            <button class="btn btn-sm btn-danger" onclick="deleteChallenge(${challenge.challenge_id})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    function getChallengeStatus(challenge) {
      const today = new Date();
      const startDate = new Date(challenge.start_date);
      const endDate = new Date(challenge.end_date);
      
      if (!challenge.is_active) return 'Inactive';
      if (today < startDate) return 'Upcoming';
      if (today > endDate) return 'Ended';
      return 'Active';
    }

    function getStatusColor(status) {
      switch(status) {
        case 'Active': return 'success';
        case 'Upcoming': return 'info';
        case 'Ended': return 'secondary';
        case 'Inactive': return 'danger';
        default: return 'secondary';
      }
    }

    function filterChallenges() {
      const searchTerm = document.getElementById('searchChallenges').value.toLowerCase();
      const statusFilter = document.getElementById('filterStatus').value;
      
      let filtered = allChallenges;
      
      if (searchTerm) {
        filtered = filtered.filter(challenge => 
          challenge.challenge_name.toLowerCase().includes(searchTerm) ||
          (challenge.description && challenge.description.toLowerCase().includes(searchTerm))
        );
      }
      
      if (statusFilter) {
        filtered = filtered.filter(challenge => {
          const status = getChallengeStatus(challenge).toLowerCase();
          return status === statusFilter;
        });
      }
      
      displayChallenges(filtered);
    }

    function editChallenge(challengeId) {
      const challenge = allChallenges.find(c => c.challenge_id === challengeId);
      if (!challenge) return;
      
      editMode = true;
      document.getElementById('challengeModalTitle').textContent = 'Edit Challenge';
      document.getElementById('challengeId').value = challenge.challenge_id;
      document.getElementById('challengeName').value = challenge.challenge_name;
      document.getElementById('description').value = challenge.description || '';
      document.getElementById('startDate').value = challenge.start_date;
      document.getElementById('endDate').value = challenge.end_date;
      document.getElementById('targetMetric').value = challenge.target_metric || '';
      document.getElementById('targetValue').value = challenge.target_value || '';
      document.getElementById('rewardPoints').value = challenge.reward_points;
      document.getElementById('isActive').checked = challenge.is_active;
      
      const modal = new bootstrap.Modal(document.getElementById('addChallengeModal'));
      modal.show();
    }

    async function saveChallenge() {
      const challengeData = {
        challenge_name: document.getElementById('challengeName').value,
        description: document.getElementById('description').value,
        start_date: document.getElementById('startDate').value,
        end_date: document.getElementById('endDate').value,
        target_metric: document.getElementById('targetMetric').value,
        target_value: document.getElementById('targetValue').value,
        reward_points: document.getElementById('rewardPoints').value,
        is_active: document.getElementById('isActive').checked
      };
      
      // Validate dates
      if (new Date(challengeData.end_date) <= new Date(challengeData.start_date)) {
        alert('End date must be after start date');
        return;
      }
      
      try {
        let response;
        if (editMode) {
          const challengeId = document.getElementById('challengeId').value;
          response = await fetch(`${API_URL}/admin/challenges/${challengeId}`, {
            method: 'PUT',
            headers: getAuthHeaders(),
            body: JSON.stringify(challengeData)
          });
        } else {
          response = await fetch(`${API_URL}/admin/challenges`, {
            method: 'POST',
            headers: getAuthHeaders(),
            body: JSON.stringify(challengeData)
          });
        }
        
        if (response.ok) {
          showChallengeAlert(`Challenge ${editMode ? 'updated' : 'created'} successfully`, 'success');
          bootstrap.Modal.getInstance(document.getElementById('addChallengeModal')).hide();
          document.getElementById('challengeForm').reset();
          editMode = false;
          await loadChallenges();
        } else {
          showChallengeAlert('Failed to save challenge', 'danger');
        }
      } catch (error) {
        console.error('Error:', error);
        showChallengeAlert('Error saving challenge', 'danger');
      }
    }

    async function toggleChallengeStatus(challengeId, isActive) {
      try {
        const response = await fetch(`${API_URL}/admin/challenges/${challengeId}/toggle`, {
          method: 'PUT',
          headers: getAuthHeaders()
        });
        
        if (response.ok) {
          showChallengeAlert('Challenge status updated', 'success');
          await loadChallenges();
        } else {
          showChallengeAlert('Failed to update status', 'danger');
        }
      } catch (error) {
        console.error('Error:', error);
        showChallengeAlert('Error updating status', 'danger');
      }
    }

    async function deleteChallenge(challengeId) {
      if (!confirm('Are you sure you want to delete this challenge? This action cannot be undone.')) return;
      
      try {
        const response = await fetch(`${API_URL}/admin/challenges/${challengeId}`, {
          method: 'DELETE',
          headers: getAuthHeaders()
        });
        
        if (response.ok) {
          showChallengeAlert('Challenge deleted successfully', 'success');
          await loadChallenges();
        } else {
          showChallengeAlert('Failed to delete challenge', 'danger');
        }
      } catch (error) {
        console.error('Error:', error);
        showChallengeAlert('Error deleting challenge', 'danger');
      }
    }

    function showChallengeAlert(message, type) {
      const alert = document.getElementById('challengeAlert');
      alert.className = `alert alert-${type}`;
      alert.textContent = message;
      alert.classList.remove('d-none');
      
      setTimeout(() => {
        alert.classList.add('d-none');
      }, 3000);
    }

    function formatDate(dateString) {
      if (!dateString) return '-';
      const date = new Date(dateString);
      return date.toLocaleDateString();
    }

    // Reset form when modal is closed
    document.getElementById('addChallengeModal').addEventListener('hidden.bs.modal', function () {
      document.getElementById('challengeForm').reset();
      document.getElementById('challengeModalTitle').textContent = 'Add New Challenge';
      editMode = false;
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Tracking - FitHive</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard"><img src="assets/logo.png" width="70" height="70">FitHive</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="workouts.html">Workouts</a></li>
          <li class="nav-item"><a class="nav-link active" href="progress.html">Progress</a></li>
          <li class="nav-item"><a class="nav-link" href="challenges.html">Challenges</a></li>
          <li class="nav-item"><a class="nav-link" href="articles.html">Articles</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <span id="navUsername">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container-fluid py-4">
    <h2 class="mb-4">Progress Tracking</h2>

    <div class="row">
      <!-- Log Progress Form -->
      <div class="col-lg-4 mb-4">
        <div class="card">
          <div class="card-header bg-primary text-white">
            <h5 class="mb-0">Log Today's Progress</h5>
          </div>
          <div class="card-body">
            <div id="progressAlert" class="alert d-none"></div>
            
            <form id="progressForm">
              <div class="mb-3">
                <label for="date" class="form-label">Date</label>
                <input type="date" class="form-control" id="date" required>
              </div>
              <div class="mb-3">
                <label for="weight" class="form-label">Weight (kg)</label>
                <input type="number" class="form-control" id="weight" step="0.1" min="0">
              </div>
              <div class="mb-3">
                <label for="caloriesConsumed" class="form-label">Calories Consumed</label>
                <input type="number" class="form-control" id="caloriesConsumed" min="0">
              </div>
              <div class="mb-3">
                <label for="workoutDuration" class="form-label">Workout Duration (min)</label>
                <input type="number" class="form-control" id="workoutDuration" min="0">
              </div>
              <div class="mb-3">
                <label for="notes" class="form-label">Notes</label>
                <textarea class="form-control" id="notes" rows="3"></textarea>
              </div>
              <button type="submit" class="btn btn-primary w-100">Log Progress</button>
            </form>
          </div>
        </div>
      </div>

      <!-- Progress Charts -->
      <div class="col-lg-8 mb-4">
        <div class="card mb-4">
          <div class="card-header">
            <h5 class="mb-0">Weight Progress</h5>
          </div>
          <div class="card-body">
            <canvas id="weightChart" height="200"></canvas>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Calorie Tracking</h5>
          </div>
          <div class="card-body">
            <canvas id="caloriesChart" height="200"></canvas>
          </div>
        </div>
      </div>

      <!-- Progress History Table -->
      <div class="col-12">
        <div class="card">
          <div class="card-header">
            <h5 class="mb-0">Progress History</h5>
          </div>
          <div class="card-body">
            <div class="table-responsive">
              <table class="table table-hover">
                <thead>
                  <tr>
                    <th>Date</th>
                    <th>Weight (kg)</th>
                    <th>Calories In</th>
                    <th>Calories Out</th>
                    <th>Workout (min)</th>
                    <th>Notes</th>
                  </tr>
                </thead>
                <tbody id="progressTableBody">
                  <tr>
                    <td colspan="6" class="text-center">Loading...</td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="text-center mt-3">
             <button id="toggleHistoryBtn" class="btn btn-outline-primary">See All</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/progress.js"></script>
  <script>
    // Set today's date as default
    document.getElementById('date').valueAsDate = new Date();

    document.getElementById('toggleHistoryBtn')
    ?.addEventListener('click', () => {
    displayProgressTable(!showingAll);
    });
  </script>
</body>
</html>

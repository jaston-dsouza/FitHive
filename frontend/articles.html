<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Articles - FitHive</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
      <a class="navbar-brand" href="/dashboard"><img src="assets/logo.png" width="70" height="70">FitHive</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="workouts.html">Workouts</a></li>
          <li class="nav-item"><a class="nav-link" href="progress.html">Progress</a></li>
          <li class="nav-item"><a class="nav-link" href="challenges.html">Challenges</a></li>
          <li class="nav-item"><a class="nav-link active" href="articles.html">Articles</a></li>
        </ul>
        <ul class="navbar-nav">
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
              <span id="navUsername">User</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end">
              <li><a class="dropdown-item" href="profile.html">Profile</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
            </ul>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="row mb-4">
      <div class="col-12">
        <h2>Fitness Articles & Tips</h2>
        <p class="text-muted">Expert advice and guidance for your fitness journey</p>
      </div>
    </div>

    <div class="row" id="articlesContainer">
      <div class="col-12 text-center">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      checkAuth();
      await loadArticles();
    });

    async function loadArticles() {
      try {
        const response = await fetch(`${API_URL}/articles`);
        
        if (response.ok) {
          const articles = await response.json();
          displayArticles(articles);
        }
      } catch (error) {
        console.error('Error loading articles:', error);
      }
    }

    function displayArticles(articles) {
      const container = document.getElementById('articlesContainer');
      
      if (articles.length === 0) {
        container.innerHTML = '<div class="col-12"><p class="text-muted">No articles available.</p></div>';
        return;
      }
      
      container.innerHTML = '';
      articles.forEach(article => {
        const card = document.createElement('div');
        card.className = 'col-md-6 col-lg-4 mb-4';
        
        card.innerHTML = `
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <span class="badge bg-primary mb-2">${article.category}</span>
              <h5 class="card-title">${article.title}</h5>
              <p class="card-text text-muted">${article.content.substring(0, 100)}...</p>
              <p class="small text-muted mb-3"><strong>By:</strong> ${article.author}</p>
              <a href="${article.external_link}" 
                target="_self"
                class="btn btn-outline-primary w-100">
                Read More
              </a>
            </div>
            <div class="card-footer bg-white border-top-0">
              <small class="text-muted">Published ${new Date(article.created_at).toLocaleDateString()}</small>
            </div>
          </div>
        `;
        
        container.appendChild(card);
      });
    }

    function readArticle(articleId) {
      window.location.href = `article-view.html?id=${articleId}`;
    }
  </script>
</body>
</html>
